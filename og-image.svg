<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="103" cy="-96" r="51" fill="#16213e" opacity="0.14"/>
    <circle cx="293" cy="9" r="85" fill="#16213e" opacity="0.07"/>
    <circle cx="450" cy="-27" r="31" fill="#16213e" opacity="0.17"/>
    <circle cx="-52" cy="655" r="30" fill="#16213e" opacity="0.15"/>
    <circle cx="1086" cy="544" r="92" fill="#16213e" opacity="0.10"/>
    <circle cx="473" cy="364" r="29" fill="#16213e" opacity="0.13"/>
    <rect x="1195" y="27" width="76" height="97" rx="8" fill="#1a1a2e" opacity="0.14" transform="rotate(0, 12, 239)"/>
    <rect x="717" y="593" width="68" height="99" rx="8" fill="#1a1a2e" opacity="0.06" transform="rotate(35, 441, 132)"/>
    <rect x="1028" y="634" width="60" height="60" rx="8" fill="#1a1a2e" opacity="0.07" transform="rotate(0, 618, 109)"/>
    <rect x="954" y="-56" width="56" height="20" rx="8" fill="#1a1a2e" opacity="0.11" transform="rotate(4, 589, 428)"/>
    <rect x="1241" y="657" width="95" height="50" rx="8" fill="#1a1a2e" opacity="0.08" transform="rotate(0, 999, 338)"/>
    <rect x="29" y="21" width="90" height="80" rx="8" fill="#1a1a2e" opacity="0.12" transform="rotate(34, 583, 221)"/>
    <rect x="597" y="302" width="80" height="90" rx="8" fill="#1a1a2e" opacity="0.15" transform="rotate(10, 575, 601)"/>
    <rect x="986" y="-56" width="23" height="51" rx="8" fill="#1a1a2e" opacity="0.09" transform="rotate(21, 743, 123)"/>
    <polygon points="414,534 482,670 346,670" fill="#16213e" opacity="0.06"/>
    <polygon points="100,507 196,699 4,699" fill="#16213e" opacity="0.06"/>
    <polygon points="250,192 291,274 209,274" fill="#16213e" opacity="0.11"/>
    <polygon points="1109,660 1162,766 1056,766" fill="#16213e" opacity="0.11"/>

  <!-- Wave at bottom -->
  <path d="M0,572 C360,601 840,543 1200,572 L1200,630 L0,630Z" fill="#16213e" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    연남 클럽 추천정보
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    연남 — 클럽
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#e94560" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#e94560" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    연남 연남 클럽 추천정보 — 클럽
  </text>
</svg>