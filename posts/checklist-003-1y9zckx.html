      <p>우리가 해결해야 할 문제를 정리해보자. 사용자는 "아식스 젤 카야노 14 OG 아이보리 컬러웨이의 2023년 리스탁에서 달라진 인솔 로고 프린트"라는 초구체적인 주제를 요구했다. 배경 키워드는 "연남 클럽 추천정보"이고, 백링크 연결은 "마포 홍대 로컬 럭셔리 밤문화 가이드"로 해야 한다.</p>
<p>캐릭터는 뉴비코스프레/평론가/과도한친절형이다. 일부러 초보인 척 하지만 결국 할 말은 다 한다. 비꼬는 건지 진심인지 모를 과한 예의와 이모티콘을 쓴다.</p>
