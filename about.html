<head>

    <!-- Canonical & OG -->
    <link rel="canonical" href="https://www.example.com/yonam-club-guide/details">

    <!-- CSS 핵심: 패턴 유지 및 구조 변형 적용 -->
    <style>
        :root {
            --bpaas-primary-color: #D4AF37; /* Gold */
            --bpaas-bg-color: #0F1215;      /* Midnight Dark */
            --bpaas-text-main: #EAEAEA;     /* White-ish */
            --bpaas-text-sub: #8A9BAC;      /* Greyish Blue */
            --bpaas-border-color: #2C3036;
            --bpaas-font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --container-width: 1200px;
        }

        /* Pattern: responsive-768 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--bpaas-font-family);
            background-color: var(--bpaas-bg-color);
            color: var(--bpaas-text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: var(--container-width);
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Navigation */
        header {
            border-bottom: 1px solid var(--bpaas-border-color);
            padding-bottom: 20px;
            margin-bottom: 60px;
        }
        
        nav ul {
            display: flex;
            justify-content: space-between;
            align-items: center;
            list-style: none;
        }

        .brand-name { font-weight: 700; font-size: 1.5rem; color: var(--bpaas-primary-color); letter-spacing: -0.5px; }
        
        .nav-links li { margin-left: 30px; }
        .nav-links a { text-decoration: none; color: var(--bpaas-text-sub); font-size: 0.9rem; transition: all 0.3s ease; }
        .nav-links a:hover { color: var(--bpaas-primary-color); }

        /* Layout Structure */
        .info-grid-wrapper { display: grid; gap: 40px; }
        
        .main-content-col { 
            grid-column: span 2; 
            border-left: 1px solid var(--bpaas-border-color);
            padding-left: 30px;
        }

        @media (max-width: 768px) {
            .info-grid-wrapper { display: block; gap: 40px; }
            .main-content-col { grid-column: span 1; border-left: none; border-top: 1px solid var(--bpaas-border-color); padding-left: 0; padding-top: 20px;}
        }

        /* Typography & Components */
        h1.page-title { font-size: 3rem; line-height: 1.2; margin-bottom: 20px; letter-spacing: -1px; color: var(--bpaas-text-main); }
        h2.section-header { font-size: 1.8rem; margin-top: 50px; margin-bottom: 20px; border-left: 4px solid var(--bpaas-primary-color); padding-left: 15px; color: #fff;}
        p.content-text { color: var(--bpaas-text-sub); font-size: 1.05rem; margin-bottom: 20px; }

        /* Meta Data Card */
        .meta-card { display: flex; justify-content: space-between; background-color: rgba(44, 48, 54, 0.6); padding: 30px; border-radius: 8px; margin-bottom: 20px; }
        .meta-item h4 { font-size: 0.9rem; color: var(--bpaas-primary-color); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px;}
        .meta-item span { font-size: 1.1rem; color: #fff; font-weight: 600; }

        /* Key Criteria Grid (New Visual Rhythm) */
        .criteria-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 30px; }
        
        .criterion-box { 
            background: #1A1E22; 
            padding: 30px; 
            border-radius: 6px; 
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease-in-out;
        }

        .criterion-box:hover { transform: translateY(-5px); background-color: #1F242A; }

        .criterion-title { font-size: 1.3rem; color: var(--bpaas-text-main); margin-bottom: 15px; display: flex; align-items: center; gap: 10px;}
        
        /* Subtle decorative element */
        .criterion-box::after { content:''; position: absolute; top: -20px; right: -20px; width: 60px; height: 60px; border-top: 2px solid var(--bpaas-primary-color); border-right: 2px solid var(--bpaas-primary-color); opacity: 0.3; }

        .criterion-desc { font-size: 0.95rem; color: #A0AEC0; line-height: 1.7; }
        
        @media (max-width: 768px) {
            .criteria-grid { grid-template-columns: 1fr; }
        }

        /* FAQ Section */
        .faq-section { margin-top: 80px; border-top: 1px solid var(--bpaas-border-color); padding-top: 40px;}
        
        details { 
            background: #1A1E22; 
            margin-bottom: 15px; 
            border-radius: 6px; 
            overflow: hidden; 
        }

        summary {
            padding: 20px;
            cursor: pointer;
            font-weight: 600;
            color: var(--bpaas-text-main);
            list-style: none;
            display: flex; justify-content: space-between; align-items: center;
        }

        summary::-webkit-details-marker { display: none; }
        
        summary::after { content: '+'; font-size: 1.5rem; color: var(--bpaas-primary-color); }
        details[open] summary::after { content: '-'; }

        .faq-answer { padding: 20px; border-top: 1px solid #2C3036; color: var(--bpaas-text-sub); font-size: 0.95rem;}

    </style>
</head>
<body>
